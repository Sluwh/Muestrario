<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mis apps - Sluwh</title>
  <meta name="description"
    content="Muestrario minimalista de aplicaciones y herramientas útiles instaladas en mi sistema, con conexiones interactivas.">
  <link rel="stylesheet" href="styles.css">
</head>

<body>

  <!-- Cursor Personalizado -->
  <div class="cursor-ring" id="cursor-ring"></div>
  <div class="cursor-dot" id="cursor-dot"></div>

  <!-- Pantalla de Carga (Preloader) -->
  <div class="preloader" id="preloader">
    <div class="preloader-brand">
      <div class="preloader-word">
        <span>M</span><span>U</span><span>E</span><span>S</span><span>T</span><span>R</span><span>A</span><span>R</span><span>I</span><span>O</span>
      </div>
    </div>
    <div class="preloader-line"></div>
  </div>

  <!-- Capa de Luz Ambiental -->
  <div class="ambient-glow"></div>

  <!-- Contenedor Principal -->
  <div class="app-wrapper">

    <!-- Encabezado / Barra Superior -->
    <header>
      <a href="#" class="brand hover-trigger">
        <div class="brand-dot"></div>
        <span class="brand-title">MUESTRAME MIS APPS</span>
        <span class="brand-tag" id="app-counter">34 HERRAMIENTAS</span>
      </a>

      <div class="header-actions">
        <!-- Caja de Búsqueda -->
        <div class="search-box">
          <svg class="search-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"
            stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="11" cy="11" r="8"></circle>
            <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
          </svg>
          <input type="text" id="search-input" placeholder="Buscar aplicaciones..." autocomplete="off">
        </div>
      </div>
    </header>

    <!-- Barra de Filtros por Categoría -->
    <div class="category-bar" id="category-bar">
      <button class="cat-pill active hover-trigger" data-category="ALL">Todas las Apps</button>
      <button class="cat-pill hover-trigger" data-category="Desarrollo">Desarrollo</button>
      <button class="cat-pill hover-trigger" data-category="Productividad">Productividad</button>
      <button class="cat-pill hover-trigger" data-category="Multimedia">Multimedia</button>
      <button class="cat-pill hover-trigger" data-category="Diseño">Diseño</button>
      <button class="cat-pill hover-trigger" data-category="Sistema">Sistema</button>
    </div>

    <!-- Contenedor del Showcase con Vista Dividida (Dashboard Fijo) -->
    <div class="showcase-container" id="showcase-container">

      <!-- Lienzo Vectorial SVG para Conexión de Flecha -->
      <svg id="connector-svg">
        <defs>
          <marker id="arrow-head" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6"
            orient="auto-start-reverse">
            <path d="M 0 0 L 10 5 L 0 10 z" fill="#ffffff" />
          </marker>
        </defs>
        <path id="connector-path" class="connector-path" d="" marker-end="url(#arrow-head)" />
      </svg>

      <!-- Columna Izquierda: Lista de Aplicaciones (Desplazable) -->
      <div class="app-list-section">
        <div class="section-label">APLICACIONES INSTALADAS</div>
        <div id="apps-list">
          <!-- Poblado dinámicamente con main.js -->
        </div>
      </div>

      <!-- Columna Derecha: Detalles de Utilidad de la Aplicación (Fija en Viewport) -->
      <div class="app-details-section" id="app-details-card">
        <div class="anchor-node-right" id="anchor-right"></div>
        <div id="details-content">
          <!-- Poblado dinámicamente con main.js -->
        </div>
      </div>

    </div>

  </div>

  <!-- Scripts JavaScript -->
  <script src="apps-data.js"></script>
  <script src="main.js"></script>
</body>

</html>
